name: CI - Main Branch

# Read-only by default. Jobs that need more scope (cache cleanup needs
# `actions: write`) declare it on the job itself — least privilege.
permissions:
    contents: read

on:
    push:
        branches: [main]

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    markdown:
        name: Lint Markdown
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                node-version: "lts/*"

            # Keyed on the lockfile so a markdownlint-cli2 bump invalidates it.
            - name: Restore npm cache
              id: npm-cache-restore
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
                restore-keys: |
                    npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-

            # `npm ci` installs the exact pinned version from package-lock.json.
            - name: Install dependencies
              run: npm ci

            # Globs and ignores come from .markdownlint-cli2.jsonc.
            - name: Lint Markdown
              run: npm run lint

            # Save the npm cache only on a miss (i.e. the lockfile changed).
            # This is the only workflow with write access to the cache —
            # PRs restore it read-only.
            - name: Save npm cache
              if: steps.npm-cache-restore.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

    cleanup-caches:
        name: Cleanup Stale Caches
        needs: markdown
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()

        # Deleting stale Actions caches via the REST API needs write scope.
        permissions:
            contents: read
            actions: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Cleanup stale caches
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                INPUT_DRY_RUN: "false"
              with:
                script: |
                    const cleanupScript = require('./.github/scripts/cleanup-caches.js');
                    await cleanupScript({ github, context, core });
